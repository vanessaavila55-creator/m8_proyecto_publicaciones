<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Trazos | Blog</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/assets/styles.css" />
    </head>

    <body>
        <div id="site-nav"></div>
        <header class="hero py-5">
            <div class="container py-4">
                <p class="eyebrow">M8 Blog · ideas que dejan huella</p>
                <h1 class="fw-bold">Historias para leer despacio.</h1>
                <p class="lead mt-4 mb-0">
                    Una comunidad para compartir miradas, experiencias y
                    conversaciones.
                </p>
            </div>
        </header>
        <main class="container page-section">
            <div
                class="d-flex flex-wrap gap-3 justify-content-between align-items-end mb-4"
            >
                <div>
                    <p class="eyebrow accent mb-2">Últimas publicaciones</p>
                    <h2 class="mb-0">El cuaderno abierto</h2>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span id="user-count" class="meta"
                        ><i class="bi bi-people me-1"></i>Cargando
                        comunidad...</span
                    ><a
                        id="write-link"
                        class="btn btn-accent d-none"
                        href="/nueva-publicacion.html"
                        ><i class="bi bi-pencil-square me-1"></i>Publicar</a
                    >
                </div>
            </div>
            <div id="message" class="alert d-none"></div>
            <div id="posts" class="row g-4"></div>
        </main>
        <footer class="container py-4 border-top">
            Trazos · Un espacio para compartir.
        </footer>
        <script src="/assets/app.js"></script>
        <script>
            renderNav("home");
            const posts = document.querySelector("#posts"),
                message = document.querySelector("#message");
            if (getUser())
                document
                    .querySelector("#write-link")
                    .classList.remove("d-none");
            const load = async () => {
                try {
                    const [postData, userData] = await Promise.all([
                        api("/api/publicaciones"),
                        api("/api/usuarios"),
                    ]);
                    const all = postData.publicaciones || [];
                    document.querySelector("#user-count").innerHTML =
                        `<i class="bi bi-people me-1"></i>${userData.totalUsuariosDb ?? userData.usuarios?.length ?? 0} personas registradas`;
                    if (!all.length) {
                        posts.innerHTML = `<div class="col-12"><div class="empty-state text-center p-5"><h3>Aún no hay publicaciones</h3><p class="meta mb-0">Sé la primera persona en compartir una historia.</p></div></div>`;
                        return;
                    }
                    posts.innerHTML = all
                        .map(
                            (post) =>
                                `<div class="col-md-6 col-xl-4"><article class="post-card p-4 d-flex flex-column"><p class="meta mb-3">${escapeHtml(post.autor?.nombre || "Autor desconocido")} · ${formatDate(post.fecha_creacion || post.createdAt)}</p><h3 class="card-title fw-bold">${escapeHtml(post.titulo)}</h3><p class="post-excerpt flex-grow-1">${escapeHtml(excerpt(post.contenido))}</p><a class="btn btn-outline-dark align-self-start" href="/publicacion.html?id=${encodeURIComponent(post.id)}">Leer publicación <i class="bi bi-arrow-up-right ms-1"></i></a></article></div>`,
                        )
                        .join("");
                } catch (error) {
                    showMessage(message, error.message);
                }
            };
            load();
        </script>
    </body>
</html>
