<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Escribir | Trazos</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/assets/styles.css" />
    </head>

    <body>
        <div id="site-nav"></div>
        <main class="container page-section">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <p class="eyebrow accent">Nueva publicación</p>
                    <h1 class="display-5 fw-bold">
                        Pon tus ideas en palabras.
                    </h1>
                    <p class="lead text-secondary mb-5">
                        Comparte algo que valga la pena conversar.
                    </p>
                    <div id="message" class="alert d-none"></div>
                    <form id="post-form">
                        <label class="form-label fw-bold" for="title"
                            >Título</label
                        ><input
                            class="form-control form-control-lg mb-4"
                            id="title"
                            maxlength="255"
                            required
                        /><label class="form-label fw-bold" for="content"
                            >Contenido</label
                        ><textarea
                            class="form-control"
                            id="content"
                            rows="12"
                            maxlength="10000"
                            required
                        ></textarea>
                        <div
                            class="d-flex justify-content-between align-items-center mt-4"
                        >
                            <a
                                class="btn btn-link text-dark px-0"
                                href="/index.html"
                                >Cancelar</a
                            ><button class="btn btn-accent" type="submit">
                                <i class="bi bi-send me-1"></i>Publicar ahora
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <script src="/assets/app.js"></script>
        <script>
            renderNav("new");
            if (!getUser())
                location.replace("/login.html?redirect=nueva-publicacion.html");
            document
                .querySelector("#post-form")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const button = event.target.querySelector("button"),
                        message = document.querySelector("#message");
                    button.disabled = true;
                    try {
                        const data = await api("/api/publicaciones", {
                            method: "POST",
                            body: JSON.stringify({
                                titulo: document
                                    .querySelector("#title")
                                    .value.trim(),
                                contenido: document
                                    .querySelector("#content")
                                    .value.trim(),
                            }),
                        });
                        location.href = `/index.html`;
                    } catch (error) {
                        showMessage(message, error.message);
                        button.disabled = false;
                    }
                });
        </script>
    </body>
</html>
