<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Ingresar | Trazos</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/assets/styles.css" />
    </head>

    <body>
        <div id="site-nav"></div>
        <main class="auth-wrap">
            <section class="auth-panel">
                <p class="eyebrow accent">Volver a la conversación</p>
                <h1 class="fw-bold mb-4">Ingresar</h1>
                <div id="message" class="alert d-none"></div>
                <form id="login-form">
                    <label class="form-label fw-bold" for="email"
                        >Correo electrónico</label
                    ><input
                        class="form-control mb-3"
                        type="email"
                        id="email"
                        autocomplete="email"
                        required
                    /><label class="form-label fw-bold" for="password"
                        >Contraseña</label
                    >
                    <div class="input-group">
                        <input
                            class="form-control"
                            type="password"
                            id="password"
                            autocomplete="current-password"
                            required
                        /><button
                            class="btn btn-outline-secondary"
                            type="button"
                            data-toggle-password="#password"
                            aria-label="Mostrar contraseña"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <button class="btn btn-accent w-100 mt-4" type="submit">
                        Entrar
                    </button>
                </form>
                <p class="meta mt-4 mb-0">
                    ¿Aún no tienes cuenta?
                    <a href="/registro.html">Regístrate</a>
                </p>
            </section>
        </main>
        <script src="/assets/app.js"></script>
        <script>
            renderNav("login");
            document
                .querySelector("[data-toggle-password]")
                .addEventListener("click", (event) => {
                    const input = document.querySelector(
                            event.currentTarget.dataset.togglePassword,
                        ),
                        icon = event.currentTarget.querySelector("i");
                    input.type =
                        input.type === "password" ? "text" : "password";
                    icon.className =
                        input.type === "password"
                            ? "bi bi-eye"
                            : "bi bi-eye-slash";
                });
            document
                .querySelector("#login-form")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const message = document.querySelector("#message"),
                        button = event.target.querySelector(
                            "button[type=submit]",
                        );
                    button.disabled = true;
                    try {
                        const data = await api("/auth/login", {
                            method: "POST",
                            body: JSON.stringify({
                                email: document
                                    .querySelector("#email")
                                    .value.trim(),
                                password:
                                    document.querySelector("#password").value,
                            }),
                        });
                        localStorage.setItem("blogToken", data.token);
                        location.href =
                            new URLSearchParams(location.search).get(
                                "redirect",
                            ) || "/index.html";
                    } catch (error) {
                        showMessage(message, error.message);
                        button.disabled = false;
                    }
                });
        </script>
    </body>
</html>
